<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
body{
    margin:3px;
    background:transparent;
    color:white;
    font-size:24px;
    font-family:Arial,sans-serif;
    text-shadow:0 2px 3px rgba(0,0,0,.9);
    -webkit-text-stroke:1px rgba(0,0,0,.9);
    paint-order:stroke fill;
}
.title{
    color:#ff9900;
    font-weight:bold;
    margin-bottom:3px;
    font-size:26px;
    padding-left:50px;
}
table{border-collapse:collapse;}
td{padding:0 1px;white-space:nowrap;}
.name{min-width:90px;}
.vote-heading td{
    color:#ff3b30!important;
    font-weight:bold;
    font-size:20px;
    padding-top:12px;
}
.vote td{
    color:#00e5ff!important;
    font-weight:bold;
    font-size:20px;
}
.total{
    color:#ff9900!important;
    font-weight:bold;
    font-size:20px;
}
.total td{color:#ff9900!important;padding-top:12px;}
.note{
    color:#00aa33;
    font-size:21px;
    margin-top:2px;
    line-height:1.15;
    display:inline-block;
}
.note-phone{font-weight:bold;}
tr:nth-child(1){color:#ffd700;font-weight:bold;}
tr:nth-child(n+2){color:white;}
#status{color:#ff9900;font-size:16px;}
</style>
</head>
<body>
<div class="title">ВАША ПОДДЕРЖКА:</div>
<div id="table">Загрузка...</div>
<div id="status" role="status"></div>

<script>
'use strict';

const SHEET_ID = '1sAXV8JkUMcH2km5rjaGfEhV44Nq8RE2TT3OWf05anOI';
const destinations = [
    'Китай',
    'Филиппины',
    'Вьетнам',
    'Индонезия',
    'Тайвань'
];
const MAX_DONORS = 10;
const REFRESH_MS = 5000;
const DAY_TIME_ZONE = 'Europe/Moscow';

function moscowDateKey(now = new Date()){
    const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone:DAY_TIME_ZONE,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
    }).formatToParts(now);

    const values = Object.fromEntries(
        parts.map(part => [part.type, part.value])
    );

    return values.year + '-' + values.month + '-' + values.day;
}

function calendarDateKey(year, month, day){
    year = Number(year);
    month = Number(month);
    day = Number(day);

    if(year < 2000 || year > 2100) return null;

    const date = new Date(Date.UTC(year, month - 1, day));

    if(
        date.getUTCFullYear() !== year ||
        date.getUTCMonth() !== month - 1 ||
        date.getUTCDate() !== day
    ){
        return null;
    }

    return String(year) + '-' +
        String(month).padStart(2, '0') + '-' +
        String(day).padStart(2, '0');
}

function donationDateKey(value){
    const text = String(value ?? '').trim();

    // Настоящая дата Google Sheets: месяц начинается с нуля.
    const nativeDate =
        /^Date\((\d{4}),(\d{1,2}),(\d{1,2})(?:,\d+)*\)$/.exec(text);

    if(nativeDate){
        return calendarDateKey(
            nativeDate[1],
            Number(nativeDate[2]) + 1,
            nativeDate[3]
        );
    }

    const russianDate = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(text);

    if(russianDate){
        return calendarDateKey(
            russianDate[3],
            russianDate[2],
            russianDate[1]
        );
    }

    const isoDate = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);

    return isoDate
        ? calendarDateKey(isoDate[1], isoDate[2], isoDate[3])
        : null;
}

function amountInKopecks(value){
    const normalized = typeof value === 'number'
        ? value
        : String(value ?? '')
            .trim()
            .replace(/[\s\u00a0\u202f]/g, '')
            .replace(/₽$/, '')
            .replace(',', '.');

    if(
        normalized === '' ||
        !/^\d+(\.\d{1,2})?$/.test(String(normalized))
    ){
        return null;
    }

    const result = Math.round(Number(normalized) * 100);

    return Number.isSafeInteger(result) && result > 0
        ? result
        : null;
}

function buildRanking(rows, now = new Date()){
    const today = moscowDateKey(now);
    const donors = new Map();

    const votes = Object.fromEntries(
        destinations.map(country => [country, 0])
    );

    let total = 0;
    let invalidCountries = 0;
    let invalidDonations = 0;
    let invalidDates = 0;

    for(const row of rows){
        const name = String(row[0] ?? '').trim();
        const rawAmount = row[1];

        if(!name || rawAmount == null || rawAmount === '') continue;

        const amount = amountInKopecks(rawAmount);

        if(amount === null){
            invalidDonations++;
            continue;
        }

        const date = donationDateKey(row[3]);

        // Ники и ИТОГО — только за сегодняшний день по Москве.
        if(date === today){
            total += amount;
            donors.set(name, (donors.get(name) || 0) + amount);
        } else if(!date){
            invalidDates++;
        }

        // Страны — за все сохранённые дни.
        // Повторно в ИТОГО эти суммы не добавляются.
        const selected = String(row[2] ?? '').trim();
        if(!selected) continue;

        const country = destinations.find(item =>
            item.toLocaleLowerCase('ru-RU') ===
            selected.toLocaleLowerCase('ru-RU')
        );

        if(country){
            votes[country] += amount;
        } else {
            invalidCountries++;
        }
    }

    return {
        donors: [...donors]
            .map(([name, amount]) => ({name, amount}))
            .sort((a, b) =>
                b.amount - a.amount || a.name.localeCompare(b.name, 'ru')
            ),

        countries: destinations
            .map((name, order) => ({
                name,
                amount:votes[name],
                order
            }))
            .sort((a, b) =>
                b.amount - a.amount || a.order - b.order
            ),

        total,
        today,
        invalidCountries,
        invalidDonations,
        invalidDates
    };
}

function formatMoney(kopecks){
    return (kopecks / 100).toLocaleString('ru-RU', {
        maximumFractionDigits:2
    });
}

function renderRanking(ranking){
    const table = document.createElement('table');

    const addCell = (row, text, span = 1, className = '') => {
        const cell = document.createElement('td');
        cell.textContent = text;
        cell.colSpan = span;
        cell.className = className;
        row.appendChild(cell);
    };

    ranking.donors.slice(0, MAX_DONORS).forEach((donor, index) => {
        const row = table.insertRow();
        const medal = ['🥇','🥈','🥉'][index] || '';

        addCell(row, (medal + ' ' + (index + 1)).trim());
        addCell(row, donor.name, 1, 'name');
        addCell(row, formatMoney(donor.amount));
        addCell(row, '₽');
    });

    const heading = table.insertRow();
    heading.className = 'vote-heading';
    addCell(heading, 'ГОЛОСУЙ РУБЛЁМ с 01 октября я еду на:', 4);

    ranking.countries.forEach(country => {
        const row = table.insertRow();
        row.className = 'vote';

        addCell(row, '- ' + country.name, 2);
        addCell(row, formatMoney(country.amount));
        addCell(row, '₽');
    });

    const total = table.insertRow();
    total.className = 'total';

    addCell(total, 'ИТОГО ЗА СЕГОДНЯ:', 2);
    addCell(total, formatMoney(ranking.total));
    addCell(total, '₽');

    const note = document.createElement('div');
    note.className = 'note';
    note.innerHTML =
        '<div>(по тел.: <span class="note-phone">+79800881969</span>)</div>' +
        '<div style="text-align:center;">или по ссылкам</div>';

    document.getElementById('table').replaceChildren(table, note);

    const messages = [];

    if(ranking.invalidCountries){
        messages.push(
            'Проверьте названия стран в столбце C: ' +
            ranking.invalidCountries
        );
    }

    if(ranking.invalidDonations){
        messages.push(
            'Проверьте суммы в столбце B: ' +
            ranking.invalidDonations
        );
    }

    if(ranking.invalidDates){
        messages.push(
            'Укажите дату ДД.ММ.ГГГГ в столбце D: ' +
            ranking.invalidDates
        );
    }

    document.getElementById('status').textContent = messages.join('. ');
}

function readSheet(){
    return new Promise((resolve, reject) => {
        const callback = '__donationSheet_' + Date.now();
        const script = document.createElement('script');
        let timer;

        const cleanup = () => {
            clearTimeout(timer);
            script.remove();
            delete window[callback];
        };

        window[callback] = response => {
            cleanup();

            if(
                response.status !== 'ok' ||
                !Array.isArray(response.table?.rows)
            ){
                reject(new Error('Google Sheets did not return a table'));
                return;
            }

            resolve(
                response.table.rows.map(row =>
                    [0,1,2,3].map(i => row.c?.[i]?.v ?? '')
                )
            );
        };

        script.onerror = () => {
            cleanup();
            reject(new Error('Google Sheets request failed'));
        };

        timer = setTimeout(() => {
            cleanup();
            reject(new Error('Google Sheets request timed out'));
        }, 15000);

        const parameters = new URLSearchParams({
            gid:'0',
            range:'A2:D',
            headers:'0',
            tqx:'out:json;responseHandler:' + callback,
            t:String(Date.now())
        });

        script.src =
            'https://docs.google.com/spreadsheets/d/' +
            SHEET_ID +
            '/gviz/tq?' +
            parameters;

        document.head.appendChild(script);
    });
}

async function loadData(){
    try{
        renderRanking(buildRanking(await readSheet()));
    } catch(error){
        console.warn('Не удалось обновить рейтинг', error);

        document.getElementById('status').textContent =
            'Данные временно не обновляются';
    } finally{
        setTimeout(loadData, REFRESH_MS);
    }
}

loadData();
</script>
</body>
</html>
