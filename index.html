<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
body{
    margin:3px;
    background:transparent;
    color:white;
    font-size:24px;
    font-family:Arial,sans-serif;
    text-shadow:none;
    -webkit-text-stroke:.7px rgba(0,0,0,.95);
    paint-order:stroke fill;
}
.overlay{
    display:inline-block;
    padding:6px 10px 8px;
    border-radius:10px;
    background:rgba(6,16,22,.62);
}
.title{
    color:#ff9900;
    font-weight:bold;
    margin-bottom:3px;
    font-size:26px;
    padding-left:50px;
}
table{border-collapse:collapse;}
td{padding:0 1px;white-space:nowrap;}
.name{min-width:90px;padding-right:12px;}
.goals-heading td{
    color:#75d4df!important;
    font-weight:bold;
    font-size:20px;
    line-height:1.05;
    padding-top:12px;
}
.goal td{
    color:#75d4df!important;
    font-weight:bold;
    font-size:20px;
    padding-bottom:5px;
}
.goal-name{min-width:230px;padding-right:8px;}
.goal-bar-cell{padding-left:8px;}
.goal-bar{
    position:relative;
    width:190px;
    height:24px;
    overflow:hidden;
    border:1px solid #58c9dc;
    border-radius:8px;
    background:rgba(15,35,44,.82);
    box-shadow:
        0 2px 3px rgba(0,0,0,.75),
        inset 0 0 4px rgba(0,0,0,.8);
}
.goal-bar-fill{
    position:relative;
    height:100%;
    min-width:0;
    overflow:hidden;
    border-radius:7px;
    background:linear-gradient(
        90deg,
        #009dcc 0%,
        #00e6b8 68%,
        #a6ff00 100%
    );
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
    transition:width .5s ease;
}
.goal-bar-fill::after{
    content:'';
    position:absolute;
    top:0;
    right:0;
    width:12px;
    height:100%;
    background:linear-gradient(90deg,rgba(166,255,0,0),#d8ff65);
    box-shadow:0 0 7px rgba(174,255,0,.95);
}
.goal-bar-value{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    -webkit-text-stroke:.35px rgba(0,0,0,.95);
    text-shadow:0 1px 2px #000;
}
.total{
    color:#ff9900!important;
    font-weight:bold;
    font-size:20px;
}
.total td{color:#ff9900!important;padding-top:12px;}
.total-value{margin-left:8px;}
.note{
    color:#fff;
    font-size:21px;
    margin-top:2px;
    line-height:1.15;
    display:inline-block;
    white-space:nowrap;
}
.note-phone{
    color:#fff;
    font-weight:bold;
}
tr:nth-child(1){color:#ffd700;font-weight:bold;}
tr:nth-child(n+2){color:white;}
#status{color:#ff9900;font-size:16px;}
</style>
</head>
<body>
<div class="overlay">
<div class="title">ВАША ПОДДЕРЖКА:</div>
<div id="table">Загрузка...</div>
<div id="status" role="status"></div>
</div>

<script>
'use strict';

const SHEET_ID = '1sAXV8JkUMcH2km5rjaGfEhV44Nq8RE2TT3OWf05anOI';
const GOALS = [
    {name:'Стабилизатор', label:'СБОР НА СТАБИЛИЗАТОР', target:10000 * 100},
    {name:'Филиппины', label:'СБОР НА ФИЛИППИНЫ', target:90000 * 100}
];
const MAX_DONORS = 10;
const REFRESH_MS = 5000;
const DAY_TIME_ZONE = 'Europe/Moscow';
const DAY_START_HOUR = 4;
// Старые голоса остаются в архиве; сборы начинаются с 3 октября.
const GOALS_START_DATE = '2026-10-03';

function moscowDateKey(now = new Date()){
    // Новый донат-день начинается в 04:00 по Москве.
    const shifted = new Date(now.getTime() - DAY_START_HOUR * 60 * 60 * 1000);
    const parts = new Intl.DateTimeFormat('en-GB', {
        timeZone:DAY_TIME_ZONE,
        year:'numeric',
        month:'2-digit',
        day:'2-digit'
    }).formatToParts(shifted);

    const values = Object.fromEntries(
        parts.map(part => [part.type, part.value])
    );

    return values.year + '-' + values.month + '-' + values.day;
}

function calendarDateKey(year, month, day){
    year = Number(year);
    month = Number(month);
    day = Number(day);

    if(year < 2000 || year > 2100) return null;

    const date = new Date(Date.UTC(year, month - 1, day));

    if(
        date.getUTCFullYear() !== year ||
        date.getUTCMonth() !== month - 1 ||
        date.getUTCDate() !== day
    ){
        return null;
    }

    return String(year) + '-' +
        String(month).padStart(2, '0') + '-' +
        String(day).padStart(2, '0');
}

function donationDateKey(value){
    const text = String(value ?? '').trim();

    // Настоящая дата Google Sheets: месяц начинается с нуля.
    const nativeDate =
        /^Date\((\d{4}),(\d{1,2}),(\d{1,2})(?:,\d+)*\)$/.exec(text);

    if(nativeDate){
        return calendarDateKey(
            nativeDate[1],
            Number(nativeDate[2]) + 1,
            nativeDate[3]
        );
    }

    const russianDate = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(text);

    if(russianDate){
        return calendarDateKey(
            russianDate[3],
            russianDate[2],
            russianDate[1]
        );
    }

    const isoDate = /^(\d{4})-(\d{2})-(\d{2})$/.exec(text);

    return isoDate
        ? calendarDateKey(isoDate[1], isoDate[2], isoDate[3])
        : null;
}

function amountInKopecks(value){
    const normalized = typeof value === 'number'
        ? value
        : String(value ?? '')
            .trim()
            .replace(/[\s\u00a0\u202f]/g, '')
            .replace(/₽$/, '')
            .replace(',', '.');

    if(
        normalized === '' ||
        !/^\d+(\.\d{1,2})?$/.test(String(normalized))
    ){
        return null;
    }

    const result = Math.round(Number(normalized) * 100);

    return Number.isSafeInteger(result) && result > 0
        ? result
        : null;
}

function buildRanking(rows, now = new Date()){
    const today = moscowDateKey(now);
    const donors = new Map();

    const goalAmounts = Object.fromEntries(
        GOALS.map(goal => [goal.name, 0])
    );

    let total = 0;
    let invalidGoals = 0;
    let invalidDonations = 0;
    let invalidDates = 0;

    for(const row of rows){
        const name = String(row[0] ?? '').trim();
        const rawAmount = row[1];

        if(!name || rawAmount == null || rawAmount === '') continue;

        const amount = amountInKopecks(rawAmount);

        if(amount === null){
            invalidDonations++;
            continue;
        }

        const date = donationDateKey(row[3]);

        // Ники и ИТОГО — только за сегодняшний день по Москве.
        if(date === today){
            total += amount;
            donors.set(name, (donors.get(name) || 0) + amount);
        } else if(!date){
            invalidDates++;
        }

        // Сборы суммируются между стримами, начиная с 3 октября.
        if(!date || date < GOALS_START_DATE) continue;

        const selected = String(row[2] ?? '').trim();
        if(!selected) continue;

        const goal = GOALS.find(item =>
            item.name.toLocaleLowerCase('ru-RU') ===
            selected.toLocaleLowerCase('ru-RU')
        );

        if(goal){
            goalAmounts[goal.name] += amount;
        } else {
            invalidGoals++;
        }
    }

    return {
        donors: [...donors]
            .map(([name, amount]) => ({name, amount}))
            .sort((a, b) =>
                b.amount - a.amount || a.name.localeCompare(b.name, 'ru')
            ),

        goals: GOALS.map(goal => ({
            ...goal,
            amount:goalAmounts[goal.name]
        })),

        total,
        today,
        invalidGoals,
        invalidDonations,
        invalidDates
    };
}

function formatMoney(kopecks){
    return (kopecks / 100).toLocaleString('ru-RU', {
        maximumFractionDigits:2
    });
}

function renderRanking(ranking){
    const table = document.createElement('table');

    const addCell = (row, text, span = 1, className = '') => {
        const cell = document.createElement('td');
        cell.textContent = text;
        cell.colSpan = span;
        cell.className = className;
        row.appendChild(cell);
        return cell;
    };

    ranking.donors.slice(0, MAX_DONORS).forEach((donor, index) => {
        const row = table.insertRow();
        const medal = ['🥇','🥈','🥉'][index] || '';

        addCell(row, (medal + ' ' + (index + 1)).trim());
        addCell(row, donor.name, 1, 'name');
        addCell(row, formatMoney(donor.amount) + ' ₽', 2);
    });

    const heading = table.insertRow();
    heading.className = 'goals-heading';
    addCell(heading, 'СБОРЫ:', 4);

    ranking.goals.forEach(goal => {
        const row = table.insertRow();
        row.className = 'goal';

        addCell(row, goal.label, 2, 'goal-name');

        const barCell = document.createElement('td');
        barCell.colSpan = 2;
        barCell.className = 'goal-bar-cell';

        const bar = document.createElement('div');
        bar.className = 'goal-bar';
        const percent = Math.min(goal.amount / goal.target * 100, 100);
        const amountText = formatMoney(goal.amount) + ' / ' +
            formatMoney(goal.target) + ' ₽';
        bar.setAttribute('role', 'progressbar');
        bar.setAttribute('aria-valuemin', '0');
        bar.setAttribute('aria-valuemax', String(goal.target / 100));
        bar.setAttribute(
            'aria-valuenow',
            String(Math.min(goal.amount, goal.target) / 100)
        );
        bar.setAttribute(
            'aria-label',
            goal.label + ': ' + amountText
        );

        const fill = document.createElement('div');
        fill.className = 'goal-bar-fill';
        fill.style.width = percent + '%';

        const value = document.createElement('span');
        value.className = 'goal-bar-value';
        value.textContent = amountText;
        value.setAttribute('aria-hidden', 'true');

        bar.appendChild(fill);
        bar.appendChild(value);
        barCell.appendChild(bar);
        row.appendChild(barCell);
    });

    const total = table.insertRow();
    total.className = 'total';
    const totalCell = addCell(total, 'ИТОГО ЗА СЕГОДНЯ:', 4);
    const totalValue = document.createElement('span');
    totalValue.className = 'total-value';
    totalValue.textContent = formatMoney(ranking.total) + ' ₽';
    totalCell.appendChild(totalValue);

    const note = document.createElement('div');
    note.className = 'note';
    note.innerHTML =
        '(по тел.: <span class="note-phone">+79800881969</span>) ' +
        'или по ссылкам';

    document.getElementById('table').replaceChildren(table, note);

    const messages = [];

    if(ranking.invalidGoals){
        messages.push(
            'Проверьте цели в столбце C: ' +
            ranking.invalidGoals
        );
    }

    if(ranking.invalidDonations){
        messages.push(
            'Проверьте суммы в столбце B: ' +
            ranking.invalidDonations
        );
    }

    if(ranking.invalidDates){
        messages.push(
            'Не проставилась служебная дата: ' +
            ranking.invalidDates
        );
    }

    document.getElementById('status').textContent = messages.join('. ');
}

let sheetRequestCounter = 0;

function readSheetTab(sheetName, required = true){
    return new Promise((resolve, reject) => {
        const callback =
            '__donationSheet_' +
            Date.now() +
            '_' +
            sheetRequestCounter++;
        const script = document.createElement('script');
        let timer;

        const cleanup = () => {
            clearTimeout(timer);
            script.remove();
            delete window[callback];
        };

        window[callback] = response => {
            cleanup();

            if(
                response.status !== 'ok' ||
                !Array.isArray(response.table?.rows)
            ){
                if(!required){
                    resolve([]);
                    return;
                }

                reject(new Error('Google Sheets did not return a table'));
                return;
            }

            resolve(
                response.table.rows.map(row =>
                    [0,1,2,3].map(i => row.c?.[i]?.v ?? '')
                )
            );
        };

        script.onerror = () => {
            cleanup();
            reject(new Error('Google Sheets request failed'));
        };

        timer = setTimeout(() => {
            cleanup();
            reject(new Error('Google Sheets request timed out'));
        }, 15000);

        const parameters = new URLSearchParams({
            sheet:sheetName,
            range:'A2:D',
            headers:'0',
            tqx:'out:json;responseHandler:' + callback,
            t:String(Date.now())
        });

        script.src =
            'https://docs.google.com/spreadsheets/d/' +
            SHEET_ID +
            '/gviz/tq?' +
            parameters;

        document.head.appendChild(script);
    });
}

async function loadData(){
    try{
        const [currentRows, archiveRows] = await Promise.all([
            readSheetTab('Data'),
            readSheetTab('Archive', false)
        ]);

        renderRanking(
            buildRanking([...archiveRows, ...currentRows])
        );
    } catch(error){
        console.warn('Не удалось обновить рейтинг', error);

        document.getElementById('status').textContent =
            'Данные временно не обновляются';
    } finally{
        setTimeout(loadData, REFRESH_MS);
    }
}

loadData();
</script>
</body>
</html>
